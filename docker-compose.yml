# One command boots the system (brief section 11): docker compose up -d --build
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app      # local-only dev credentials, not a secret
      POSTGRES_DB: app
    ports:
      - "${DB_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://app:app@db:5432/app
      TEST_DATABASE_URL: postgresql+psycopg://app:app@db:5432/app_test
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data:ro       # new images are visible without a rebuild
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 5s
      timeout: 3s
      retries: 20

  # Background worker: all vision/embedding calls run here, never on the request path.
  worker:
    build: .
    command: python -m app.jobs.worker
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://app:app@db:5432/app
    depends_on:
      api:
        condition: service_healthy   # the api applies migrations on boot
    volumes:
      - ./data:/app/data:ro
    restart: unless-stopped

  # Fully local, no-key path (brief section 10): docker compose --profile local up -d
  ollama:
    image: ollama/ollama
    profiles: ["local"]
    volumes:
      - ollama:/root/.ollama

volumes:
  pgdata:
  ollama:
